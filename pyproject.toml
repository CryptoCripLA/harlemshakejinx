[project]
name = "jinx"
version = "0.1.0"
description = "JINX: one coordinated Solana trading engine built to the CHAD blueprint (HEAR CHATTER -> SIZE -> FIRE -> EXIT)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# owner storage rule 6: tests clean up after themselves (no .pytest_cache, no retained temp directories)
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
markers = [
    "live: needs live network access (PumpPortal); deselect with -m 'not live'",
    "node: needs Node.js and the built GMGN bridge",
]
